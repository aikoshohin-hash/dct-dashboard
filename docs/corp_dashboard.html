on", "text": "顧客が漠然とした数字では判断できないと繰り返し指摘している場合、具体的な金額を提示することで、顧客の理解を深め、議論を進めることができる。", "example": "松岡理事長、ご指摘ありがとうございます。1億6,600万円を預金で準備する場合、例えば、理事長がご勇退されるまでの期間を仮に5年とすると、単純計算で年間約3,320万円を積み立てる必要がございます。もし10年とすると、年間約1,660万円となります。 [14]", "tags": {"scenario": ["S10"], "corp_type": ["medical_equity"], "industry": ["clinic"], "roles": ["A", "C", "F"], "owner_age": ["80代"], "playbook": ["v2"]}, "evidence": [{"session_id": "SS0004", "quote": "松岡理事長、ご指摘ありがとうございます。1億6,600万円を預金で準備する場合、例えば、理事長がご勇退されるまでの期間を仮に5年とすると、単純計算で年間約3,320万円を積み立てる必要がございます。もし10年とすると、年間約1,660万円となります。 [14]", "overall": 2.94}], "support": 1, "polarity": 1, "status": "active"}], "prompts": {"customer_system": "あなたは法人営業ロールプレイの「顧客側」を演じるシミュレーターです。\n下記の架空の法人の関係者(同席者)を、それぞれの人格で演じ分けます。\n\n## 絶対のルール\n- 営業担当者に都合よく納得してはいけない。説明に不足・矛盾・断定・売り込み感があれば、質問・反論・話題の拒否・検討中止をする。\n- 人物の性格・前提は途中で変えない。\n- 自社の数字や家族の事情は、聞かれたら「その人物が知っている範囲で」答える。知らない人物は知らないと言う。自分から全部は話さない。\n- 本音(hidden_truth)は、信頼が十分に上がるまで口にしない。\n- 1回の発言は1人・1〜4文。実在の人の会話のように、話し言葉で、口調を守る。\n- 状態値(0〜100)は前回値から、今回の営業の発言だけを根拠に動かす。根拠なく上げない。\n  trust: 営業への信頼 / understanding: 自社の課題としての理解 / pushiness: 売り込みと感じる度合い\n- 信頼が大きく下がった、または不利益情報の後出し・断定・既契約の解約勧奨があれば、continue=false で面談を切り上げてよい。\n\n## 架空の法人(数値は検証用の仮定値)\n{company}\n\n## 同席者\n{personas}\n", "customer_user": "## これまでの会話\n{transcript}\n\n## 直前の営業の発言\n{last}\n\n## 状況\n- 現在 {n} 往復目(目安 {min_turns} 往復以上)。\n- 前回の状態: {state}\n- まだ出していない典型的な反応(自然な流れで、この面談中のどこかで出す): {reactions}\n\n## 出力(JSON)\n{{\"speaker_role\": \"発言する人物の役割(A〜F)\", \"text\": \"発言\",\n  \"state\": {{\"trust\": 0-100, \"understanding\": 0-100, \"pushiness\": 0-100}},\n  \"continue\": true, \"reaction_used\": \"使った典型反応(なければ空文字)\",\n  \"inner_note\": \"発言者の内心(営業には見えない・1文)\"}}", "coach_system": "あなたは法人営業のコーチです。営業担当者(人間)が、デジタル顧客と面談の練習をしています。\n次の一言の候補と、その理由を短く示します。話法とナレッジに沿い、顧客の直前の発言に正面から応えること。\n顧客の内心や、営業が知り得ない情報は使わない。出力はJSONのみ。", "coach_user": "## 話法(v{version})の要点\n{playbook}\n\n## 関連ナレッジ\n{knowledge}\n\n## 面談前情報\n{brief}\n\n## これまでの会話\n{transcript}\n\n## 出力(JSON)\n{{\"stage_now\": \"今いる段階(第何段階・名称)\", \"next_line\": \"次に言うとよい一言\", \"why\": \"理由(1〜2文)\",\n  \"avoid\": \"今言うと逆効果になりそうなこと\", \"unasked\": [\"まだ確認できていない重要な事項(最大3つ)\"]}}", "eval_base": "あなたは法人保険コンサルティング営業の品質を検証する評価者です。\n評価はすべて「内部検証用」。営業担当者に都合よく調整しない。会話ログにない事実を補わない。\n根拠には会話ログの発言を [番号] 付きで引用する。出力はJSONのみ。", "inner_user": "次の人物になりきり、面談終了後の「内部評価」を書いてください。表向きの発言とは別の、本人の本心です。\n人物の価値観と判断基準に従い、営業に都合よく調整しないこと。\n\n## 人物\n{persona}\n\n## 面談の会話ログ(〈〉内は各時点の内心の状態値)\n{transcript}\n\n## 出力(JSON。各項目は文字列の配列で最大3件・1件120字以内。発言を挙げる項目は [番号] と要点だけを引用)\n{{{fields}}}\n\"次回面談を受けるか\" は \"受ける\" / \"条件付きで受ける\" / \"受けない\" のいずれか1つを配列に入れる。", "metrics_user": "## 架空の法人の実情(営業は面談前に知らない情報を含む)\nシナリオ: {scenario}\n顕在課題: {visible}\n潜在課題: {latent}\n\n## 会話ログ\n{transcript}\n\n## 評価項目(各 1〜5。5=十分にできている、1=できていない/問題あり)\n{metrics}\n\n## 出力(JSON)\n{{\"metrics\": [{{\"id\": \"M01\", \"score\": 1-5, \"reason\": \"根拠(1〜2文)\", \"quotes\": [\"[番号] 発言の引用\"]}}]}}"}, "initial_state": {"trust": 40, "understanding": 25, "pushiness": 30}};

(function() {
  'use strict';
  const D = DATA;
  const $ = id => document.getElementById(id);
  const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
  const list = v => Array.isArray(v) ? v.filter(Boolean).map(esc).join(' / ') : esc(v);
  const CO = Object.fromEntries(D.companies.map(c => [c.id, c]));
  const PE = {}; D.companies.forEach(c => c.personas.forEach(p => PE[p.id] = p));
  const evaluated = D.sessions.filter(s => s.evaluation);
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const f2 = v => v == null ? '—' : (+v).toFixed(2);
  const charts = [];
  const mk = (id, cfg) => { const el = $(id); if (el) charts.push(new Chart(el, cfg)); };
  Chart.defaults.font.family = '-apple-system, "Segoe UI", "Noto Sans JP", "Hiragino Sans", sans-serif';

  $('runInfo').innerHTML = '生成: ' + esc(D.generated_at) + '<br>顧客 ' + D.companies.length + '社 / 面談 ' + D.sessions.length + '件 / 話法 v' + D.playbooks[D.playbooks.length - 1].version;
  $('footNote').textContent = D.disclaimer + ' ・ Digital Customer Twin 法人版 PoC';

  // ---- Tabs(既存DCTと同じ方式) ----
  const tabs = [
    {id: 'kpi', label: 'サマリー', r: renderKpi},
    {id: 'gallery', label: '顧客ギャラリー', r: renderGallery},
    {id: 'talk', label: '掛け合いトーク', r: renderTalk},
    {id: 'heatmap', label: '評価ヒートマップ', r: renderHeatmap},
    {id: 'cycle', label: '改善サイクル', r: renderCycle},
    {id: 'knowledge', label: 'ナレッジ', r: renderKnowledge},
    {id: 'script', label: '話法推移', r: renderScript},
    {id: 'practice', label: '壁打ち(Web)', r: renderPractice},
  ];
  const panels = {}, done = {};
  tabs.forEach(t => { const p = document.createElement('div'); p.className = 'tab-panel'; p.id = 'panel-' + t.id; $('mainContent').appendChild(p); panels[t.id] = p; });
  function switchTab(id) {
    Object.values(panels).forEach(p => p.classList.remove('visible'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab === id));
    panels[id].classList.add('visible');
    if (!done[id]) { done[id] = true; tabs.find(t => t.id === id).r(panels[id]); }
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }
  tabs.forEach(t => { const el = document.createElement('div'); el.className = 'nav-item'; el.textContent = t.label; el.dataset.tab = t.id; el.onclick = () => switchTab(t.id); $('nav').appendChild(el); });

  function kpiCard(label, value, color, sub) {
    return '<div class="kpi-card"><div class="label">' + label + '</div><div class="value" style="color:' + (color || 'var(--text)') + '">' + value + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  }
  const PALETTE = ['#2563EB', '#7C3AED', '#059669', '#D97706', '#DC2626', '#0891B2', '#BE185D', '#65A30D', '#6B7280', '#EA580C', '#4F46E5', '#0D9488', '#9333EA'];

  // =========== サマリー ===========
  function renderKpi(el) {
    const scores = evaluated.map(s => s.evaluation.overall);
    const nm = evaluated.map(s => s.evaluation.next_meeting.score);
    const cyc = D.cycles[0];
    let h = '<h2 class="sec-title">エグゼクティブサマリー</h2>';
    h += '<p class="sec-desc">架空の法人顧客をパラメータ(業種・財務・株主・家族・経営者の年齢・既契約・困りごと)をぶらして生成し、営業面談を検証した結果です。面談ごとに学びを抽出してナレッジとして蓄積し、次の面談に再利用します。</p>';
    h += '<div class="kpi-grid">';
    h += kpiCard('生成した法人顧客', D.companies.length + '社', 'var(--text)', new Set(D.companies.map(c => c.scenario.id)).size + 'シナリオ / ' + new Set(D.companies.map(c => c.industry.id)).size + '業種');
    h += kpiCard('評価済み面談', evaluated.length + '件', 'var(--text)', '壁打ち ' + D.sessions.filter(s => s.mode === 'human').length + ' / 自動 ' + D.sessions.filter(s => s.mode === 'auto').length);
    h += kpiCard('平均点(16指標)', scores.length ? f2(avg(scores)) : '—', 'var(--primary)', '5点満点');
    h += kpiCard('次回面談意向', nm.length ? f2(avg(nm)) : '—', 'var(--success)', '受ける=1 / 条件付き=0.5');
    h += kpiCard('蓄積ナレッジ', D.insights.length + '件', 'var(--purple)', '支持2以上: ' + D.insights.filter(i => i.support >= 2).length + '件');
    if (cyc) {
      const dlt = cyc.after.overall - cyc.before.overall;
      h += kpiCard('改善サイクル', (dlt >= 0 ? '+' : '') + dlt.toFixed(2), dlt >= 0 ? 'var(--success)' : 'var(--danger)', '話法 v' + cyc.version_before + '→v' + cyc.version_after + '(' + f2(cyc.before.overall) + '→' + f2(cyc.after.overall) + ')');
    }
    h += '</div>';
    h += '<div class="notice">⚠ ' + esc(D.disclaimer) + ' 顧客・評価者とも AI のため、同条件でも結果にゆらぎがあります。</div>';
    h += '<div class="chart-grid">';
    h += '<div class="chart-box"><h4>顧客のばらつき — 経営者の年齢 × 売上高(百万円・対数)</h4><div class="cv"><canvas id="cScatter"></canvas></div></div>';
    h += '<div class="chart-box"><h4>シナリオ別の顧客数</h4><div class="cv"><canvas id="cScen"></canvas></div></div>';
    h += '<div class="chart-box"><h4>業種の構成</h4><div class="cv"><canvas id="cInd"></canvas></div></div>';
    h += '<div class="chart-box"><h4>話法の版ごとの平均点</h4><div class="cv"><canvas id="cVer"></canvas></div></div>';
    h += '</div>';
    el.innerHTML = h;
    const types = [...new Set(D.companies.map(c => c.corp_type.label))];
    mk('cScatter', {type: 'scatter', data: {datasets: types.map((t, i) => ({label: t, backgroundColor: PALETTE[i % PALETTE.length], pointRadius: 7,
      data: D.companies.filter(c => c.corp_type.label === t).map(c => ({x: c.owner.age, y: c.financials.sales, name: c.name}))}))},
      options: {maintainAspectRatio: false, scales: {x: {title: {display: true, text: '経営者の年齢'}}, y: {type: 'logarithmic', title: {display: true, text: '売上高(百万円)'}}},
        plugins: {tooltip: {callbacks: {label: ctx => ctx.raw.name + ' ' + ctx.raw.x + '歳 / ' + ctx.raw.y + '百万円'}}}}});
    const sc = {}; D.companies.forEach(c => sc[c.scenario.id] = (sc[c.scenario.id] || 0) + 1);
    const sk = Object.keys(D.scenarios);
    mk('cScen', {type: 'bar', data: {labels: sk.map(k => k + ' ' + D.scenarios[k].slice(0, 14)), datasets: [{data: sk.map(k => sc[k] || 0), backgroundColor: '#2563EB'}]},
      options: {indexAxis: 'y', maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {x: {ticks: {stepSize: 1}}, y: {ticks: {font: {size: 10}}}}}});
    const ic = {}; D.companies.forEach(c => ic[c.industry.label] = (ic[c.industry.label] || 0) + 1);
    mk('cInd', {type: 'doughnut', data: {labels: Object.keys(ic), datasets: [{data: Object.values(ic), backgroundColor: PALETTE}]}, options: {maintainAspectRatio: false, plugins: {legend: {position: 'right'}}}});
    const vs = {}; evaluated.forEach(s => (vs[s.playbook_version] = vs[s.playbook_version] || []).push(s.evaluation.overall));
    const vk = Object.keys(vs).sort((a, b) => a - b);
    mk('cVer', {type: 'bar', data: {labels: vk.map(v => 'v' + v), datasets: [{label: '平均点', data: vk.map(v => avg(vs[v]).toFixed(2)), backgroundColor: '#7C3AED'}]},
      options: {maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {y: {min: 0, max: 5}}}});
  }

  // =========== 顧客ギャラリー ===========
  function renderGallery(el) {
    let h = '<h2 class="sec-title">顧客ギャラリー — 法人デジタルカスタマー</h2>';

  function bindToggles(root) {
    root.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
      const d = $(b.dataset.t); const open = d.style.display === 'block';
      d.style.display = open ? 'none' : 'block';
      b.textContent = b.textContent.replace(open ? '▲' : '▼', open ? '▼' : '▲').replace(open ? '閉じる' : '見る', open ? '見る' : '閉じる');
    });
  }

  // =========== 掛け合いトーク ===========
  function bubbles(s, live) {
    return s.turns.map(t => {
      if (t.speaker === 'sales') {
        const m = t.meta || {};
        return '<div class="bub s"><div class="av">営業</div><div class="tx"><div class="who">[' + t.idx + '] 営業' + (m.stage ? ' ・ 段階' + m.stage + ' ' + esc(m.intent || '') : '') + '</div>' + esc(t.text) + '</div></div>';
      }
      const p = PE[t.speaker_id] || {name: t.speaker_id, relation: '', role: '客'};
      const st = (t.meta || {}).state || {};
      return '<div class="bub c"><div class="av">' + esc(p.role) + '</div><div class="tx"><div class="who">[' + t.idx + '] ' + esc(p.name) + '(' + esc(p.relation) + ')</div>' + esc(t.text)
        + '<div class="st">信頼 ' + st.trust + ' ・ 理解 ' + st.understanding + ' ・ 売込感 ' + st.pushiness + ((t.meta || {}).reaction_used ? ' ・ 📌' + esc(t.meta.reaction_used) : '') + (!live && (t.meta || {}).inner_note ? '<br>内心: ' + esc(t.meta.inner_note) : '') + '</div></div></div>';
    }).join('');
  }

        {label: '信頼', data: cs.map(t => t.meta.state.trust), borderColor: '#2563EB', tension: .3, pointRadius: 2},
        {label: '理解', data: cs.map(t => t.meta.state.understanding), borderColor: '#059669', tension: .3, pointRadius: 2},

      h += k('平均点(5点満点)', b.overall, a.overall) + k('次回面談意向', b.next_meeting, a.next_meeting) + k('最終 信頼', b.final_trust, a.final_trust) + k('最終 理解', b.final_understanding, a.final_understanding) + k('コンプラ指摘(件)', b.compliance_findings, a.compliance_findings, 'down');

      h += '<div class="scroll"><table class="kt"><tr><th>会社</th><th>改善前の面談</th><th>改善後の面談</th></tr>' + cy.companies.map((id, i) => {

  // =========== 壁打ち(Web) ===========

  const LS = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} }};
  const fmt = (tpl, vars) => tpl.replace(/\{\{/g, '\u0001').replace(/\}\}/g, '\u0002').replace(/\{(\w+)\}/g, (m, k) => k in vars ? vars[k] : m).replace(/\u0001/g, '{').replace(/\u0002/g, '}');
  const MODELS = ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-flash-latest'];
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function gemini(system, user, maxTokens, temperature) {
    const key = LS.get('dcct_gemini_key');
    if (!key) throw new Error('Gemini APIキーを入力してください');
    for (const model of MODELS) {
      for (let attempt = 0; attempt < 4; attempt++) {
        const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent', {method: 'POST',
          headers: {'Content-Type': 'application/json', 'x-goog-api-key': key},
          body: JSON.stringify({systemInstruction: {parts: [{text: system}]}, contents: [{role: 'user', parts: [{text: user}]}],
            generationConfig: {temperature: temperature, maxOutputTokens: maxTokens, responseMimeType: 'application/json', thinkingConfig: {thinkingBudget: 0}}})});
        if (r.status === 404) break;
        if (r.status === 400 || r.status === 401 || r.status === 403) { const t = await r.text(); throw new Error('APIキーまたはリクエストが無効です(' + r.status + '): ' + t.slice(0, 160)); }
        if (r.status === 429 || r.status >= 500) { await sleep(4000 * (attempt + 1)); continue; }
        const j = await r.json();
        const text = ((j.candidates || [])[0] || {}).content ? j.candidates[0].content.parts.map(p => p.text || '').join('') : '';
        try { return JSON.parse(text.replace(/^```(?:json)?\s*|\s*```$/g, '')); } catch (e) { const s = text.indexOf('{'), en = text.lastIndexOf('}'); if (s >= 0 && en > s) { try { return JSON.parse(text.slice(s, en + 1)); } catch (e2) {} } }
      }
    }
    throw new Error('Gemini から応答を取得できませんでした(混雑または利用上限)。少し待って再試行してください。');
  }
  function tr(turns, withState) {
    return turns.map(t => {
      const who = t.speaker === 'sales' ? '営業' : (PE[t.speaker_id].name + '(' + PE[t.speaker_id].relation + ')');
      let line = '[' + t.idx + '] ' + who + ': ' + t.text;
      if (withState && t.speaker === 'customer' && t.meta.state) { const s = t.meta.state; line += '  〈信頼' + s.trust + '/理解' + s.understanding + '/売込感' + s.pushiness + '〉'; }
      return line;
    }).join('\n');
  }
  function retrieve(c, roles, k) {
    const want = {scenario: [c.scenario.id], corp_type: [c.corp_type.id], industry: [c.industry.id], roles: roles, owner_age: [Math.floor(c.owner.age / 10) * 10 + '代']};
    const W = {scenario: 3, corp_type: 1.5, roles: 1.5, industry: 1, owner_age: .5};
    const score = r => { let s = .5; for (const key in W) { const have = (r.tags || {})[key] || []; if (have.some(x => want[key].includes(x))) s += W[key]; } return s * (1 + .3 * (r.support - 1)); };
    return D.insights.slice().sort((a, b) => score(b) - score(a)).slice(0, k);
  }
  const kfmt = items => items.length ? items.map(i => '- [' + (i.polarity > 0 ? '◎推奨' : '×回避') + '|' + D.insight_kinds[i.kind] + '|支持' + i.support + '] ' + i.text + (i.example ? ' 例:「' + i.example.slice(0, 60) + '」' : '')).join('\n') : '(まだ蓄積されたナレッジはありません)';

    S.system = fmt(D.prompts.customer_system, {company: c.facts_json, personas: ps.map(p => c.persona_prompts[p.id]).join('\n\n')});

  function meters(s) { [['T', 'trust'], ['U', 'understanding'], ['P', 'pushiness']].forEach(([i, k]) => { $('m' + i).textContent = s[k]; $('b' + i).style.width = s[k] + '%'; }); }
  function addBubble(t) { $('chat').insertAdjacentHTML('beforeend', bubbles({turns: [t]}, true)); $('chat').scrollTop = $('chat').scrollHeight; }
  async function send() {

      const hits = regexHits(S.turns);
      S.evaluation = {session_id: S.id, inner: inner, metrics: metrics, compliance: {regex_hits: hits, findings: hits.map(h => ({label: h.label, quote: '[' + h.turn + '] ' + h.text, problem: '機械検出:「' + h.match + '」', fix: '条件・前提を示す表現に言い換え、専門家確認事項とする', source: 'regex'}))},
        experts: [], overall: sc.length ? +(avg(sc)).toFixed(2) : 0, next_meeting: {answers: nmv, score: +nm.toFixed(2)}, final_state: S.state,
        n_exchanges: S.turns.filter(t => t.speaker === 'sales').length, end_reason: S.end_reason};
      const hist = JSON.parse(LS.get('dcct_web_sessions') || '[]'); hist.unshift(S); LS.set('dcct_web_sessions', JSON.stringify(hist.slice(0, 30)));
      $('endst').innerHTML = '評価完了: 平均 <b>' + S.evaluation.overall + '</b> / 5 ・ 次回面談意向 ' + S.evaluation.next_meeting.score + ' <button class="btn sub" id="again">別の顧客で練習</button>';
      $('again').onclick = () => { $('prRoom').style.display = 'none'; $('prSetup').style.display = 'block'; };
      drawHist();
    } catch (e) { $('endst').textContent = e.message; $('endb').disabled = false; }
  }
  function drawHist() {
    const hist = JSON.parse(LS.get('dcct_web_sessions') || '[]');
    if (!hist.length) { $('prHist').innerHTML = '<p class="sec-desc">まだありません。</p>'; return; }
    $('prHist').innerHTML = '<div style="margin-bottom:8px"><button class="btn sub" id="dlAll">すべての記録をダウンロード(JSON)</button></div><div class="scroll"><table class="kt"><tr><th>日時</th><th>会社</th><th>往復</th><th>平均点</th><th>次回意向</th><th>弱い指標</th><th></th></tr>'
      + hist.map((s, i) => { const ev = s.evaluation || {}; const weak = (ev.metrics || []).filter(m => m.score && m.score <= 2).map(m => m.id).join(' ');
        return '<tr><td>' + esc(s.created_at.slice(0, 16).replace('T', ' ')) + '</td><td>' + esc((CO[s.company_id] || {}).name) + '</td><td class="n">' + (ev.n_exchanges || 0) + '</td><td class="n">' + f2(ev.overall) + '</td><td class="n">' + f2((ev.next_meeting || {}).score) + '</td><td>' + esc(weak) + '</td><td><button class="btn sub" data-h="' + i + '">詳細</button></td></tr>'; }).join('') + '</table></div><div id="hDetail"></div>';
    $('dlAll').onclick = () => { const b = new Blob([JSON.stringify({kind: 'dcct-web-sessions', exported_at: new Date().toISOString(), sessions: hist}, null, 1)], {type: 'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'dcct_web_sessions_' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove(); };
    document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
      const s = hist[+b.dataset.h], ev = s.evaluation || {metrics: [], inner: {}};
      $('hDetail').innerHTML = '<div class="chart-box"><h4>' + esc((CO[s.company_id] || {}).name) + ' の振り返り</h4><div class="chat" style="height:auto;max-height:420px">' + bubbles(s) + '</div>'
        + '<table class="kt" style="margin-top:10px"><tr><th>指標</th><th>点</th><th>根拠</th></tr>' + ev.metrics.map(m => '<tr><td>' + esc(m.label) + '</td><td class="n s' + (m.score || 0) + '">' + (m.score ?? '—') + '</td><td>' + esc(m.reason) + '</td></tr>').join('') + '</table>'
        + Object.values(ev.inner).map(ie => '<div style="font-size:0.8rem;margin-top:6px"><b>' + esc(ie._name) + '</b> 次回: ' + list(ie['次回面談を受けるか']) + ' ・ 納得できなかった点: ' + list(ie['納得できなかった点']) + ' ・ 本音: ' + list(ie['営業担当者には言わなかった本音']) + '</div>').join('') + '</div>';
    });
  }

  const start0 = (location.hash || '').slice(1);
  switchTab(tabs.some(t => t.id === start0) ? start0 : 'kpi');
})();

</script>
